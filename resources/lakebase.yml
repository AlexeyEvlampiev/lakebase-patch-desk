# The demo's Lakebase project: Postgres 18, smallest compute, scales to zero
# after 5 minutes idle. The identity that runs `bundle deploy` (the deploy
# service principal) becomes the project owner.
resources:
  postgres_projects:
    lakebase:
      project_id: lakebase-patch-desk
      display_name: Lakebase patch desk
      pg_version: 18
      budget_policy_id: ${var.usage_policy_id}
      custom_tags:
        - key: project
          value: lakebase-patch-desk
      default_endpoint_settings:
        autoscaling_limit_min_cu: 0.5
        autoscaling_limit_max_cu: 0.5
        suspend_timeout_duration: 300s
